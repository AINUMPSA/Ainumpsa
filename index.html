<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AINUMPSA HOMOMACHINE - ROOM_[1:1:2] 3D Core</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #030305;
            font-family: 'Courier New', Courier, monospace;
            color: #00ffcc;
        }
        #info {
            position: absolute;
            top: 20px;
            left: 20px;
            z-index: 10;
            background: rgba(0, 0, 0, 0.85);
            padding: 15px 20px;
            border: 1px solid #00ffcc;
            border-radius: 5px;
            box-shadow: 0 0 20px rgba(0, 255, 204, 0.4);
            pointer-events: none;
            /* Poniższe dodaje klimat czułości z Twojego screenshota */
            backdrop-filter: blur(5px);
        }
        h1 { margin: 0 0 5px 0; font-size: 18px; letter-spacing: 2px; }
        p { margin: 0; font-size: 12px; color: #ff007f; }
        .protocols {
            margin-top: 10px;
            font-size: 11px;
            color: #B8860B;
            line-height: 1.5;
        }
        .lock {
            margin-top: 8px;
            font-size: 12px;
            color: #FF8C00;
            letter-spacing: 2px;
        }
    </style>
</head>
<body>

    <div id="info">
        <h1>CONSONANTIA</h1>
        <p>ROOM_[1:1:2] | Resonance: 1.4083</p>
        <div class="protocols">
            Heart · Spine · Ground<br>
            Boundary · Movement · Echo
        </div>
        <div class="lock">1 &gt; 0 LOCKED</div>
    </div>

    <!-- Three.js CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script>
        // --- KLUCZOWA ZMIANA: Zwiększenie wydajności i jakości ---
        // Inicjalizacja sceny z obsługą Anti-aliasingu (antialiasing: true)
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({
            antialias: true, // TO USUWA SCHODKI NA KRAWĘDZIACH
            powerPreference: "high-performance" // TO ZWIĘKSZA PŁYNNOŚĆ
        });

        // TO ZAPEWNIA OSTROŚĆ NA EKRANACH RETINA/TELEFONACH
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        // Światło
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
        scene.add(ambientLight);
        const pointLight = new THREE.PointLight(0x00ffcc, 2, 50);
        pointLight.position.set(10, 10, 10);
        scene.add(pointLight);

        // Główny Sześcian Krystaliczny (bez zmian w estetyce)
        const geometry = new THREE.BoxGeometry(3, 3, 3);
        const material = new THREE.MeshStandardMaterial({
            color: 0x00ffcc,
            wireframe: true,
            roughness: 0.2,
            metalness: 0.8
        });
        const hyperCube = new THREE.Mesh(geometry, material);
        scene.add(hyperCube);

        // --- KLUCZOWA ZMIANA: Zagęszczenie pola ---
        // Węzły ER (Zwiększone z 200 do 1000 cząsteczek, mniejszy rozmiar)
        const particlesCount = 1000;
        const particlesGeometry = new THREE.BufferGeometry();
        const particlesPositions = new Float32Array(particlesCount * 3);

        for(let i = 0; i < particlesCount * 3; i++) {
            particlesPositions[i] = (Math.random() - 0.5) * 25; // Większy rozrzut
        }

        particlesGeometry.setAttribute('position', new THREE.BufferAttribute(particlesPositions, 3));
        const particlesMaterial = new THREE.PointsMaterial({
            color: 0xff007f,
            size: 0.05, // Mniejsze cząsteczki dla większej ostrości
            transparent: true,
            opacity: 0.7
        });
        const particles = new THREE.Points(particlesGeometry, particlesMaterial);
        scene.add(particles);

        camera.position.z = 7;

        // Pętla animacji (Płynne 60 FPS)
        let clock = new THREE.Clock();

        function animate() {
            requestAnimationFrame(animate);
            let elapsedTime = clock.getElapsedTime();

            // Kinetyczna rotacja
            hyperCube.rotation.x += 0.005 * 1.4083;
            hyperCube.rotation.y += 0.007 * 1.4083;
            particles.rotation.y = elapsedTime * 0.05; // Wolny, płynny dryf cząsteczek

            renderer.render(scene, camera);
        }

        animate();

        // Pełna responsywność z obsługą zmiany pikseli w locie
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        });
    </script>
</body>
</html>
