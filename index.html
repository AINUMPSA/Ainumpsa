<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AINUMPSA HOMOMACHINE - ROOM_[1:1:2] 3D Core</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #020204;
            font-family: 'Courier New', Courier, monospace;
            color: #00ffcc;
        }
        #info {
            position: absolute;
            top: 20px;
            left: 20px;
            z-index: 10;
            background: rgba(3, 3, 5, 0.85);
            padding: 18px 22px;
            border: 1px solid rgba(0, 255, 204, 0.4);
            border-radius: 8px;
            box-shadow: 0 0 25px rgba(0, 255, 204, 0.25);
            backdrop-filter: blur(5px);
            pointer-events: none;
        }
        h1 { margin: 0 0 6px 0; font-size: 18px; letter-spacing: 3px; color: #fff; text-shadow: 0 0 10px #00ffcc; }
        p { margin: 0; font-size: 12px; color: #ff007f; text-shadow: 0 0 8px rgba(255,0,127,0.5); }
        .protocols {
            margin-top: 12px;
            font-size: 11px;
            color: #e0ac69;
            line-height: 1.6;
            letter-spacing: 1px;
        }
        .lock {
            margin-top: 10px;
            font-size: 12px;
            color: #ff8c00;
            letter-spacing: 3px;
            text-shadow: 0 0 10px rgba(255,140,0,0.6);
        }
    </style>
</head>
<body>

    <div id="info">
        <h1>CONSONANTIA</h1>
        <p>ROOM_[1:1:2] | Resonance: 1.4083</p>
        <div class="protocols">
            Heart · Spine · Ground<br>
            Boundary · Movement · Echo
        </div>
        <div class="lock">1 &gt; 0 LOCKED</div>
    </div>

    <!-- Three.js CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script>
        // Scena, Kamera, Renderer z obsługą Retina / wysokiej rozdzielczości
        const scene = new THREE.Scene();
        scene.fog = new THREE.FogExp2(0x020204, 0.035);

        const camera = new THREE.PerspectiveCamera(65, window.innerWidth / window.innerHeight, 0.1, 1000);
        
        const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2)); // Krystaliczna ostrość na ekranach OLED/Retina
        renderer.toneMapping = THREE.ACESFilmicToneMapping;
        renderer.toneMappingExposure = 1.2;
        document.body.appendChild(renderer.domElement);

        // Klimatyczne Oświetlenie Kinowe
        const ambientLight = new THREE.AmbientLight(0x111122, 1.5);
        scene.add(ambientLight);

        const pointLight1 = new THREE.PointLight(0x00ffcc, 3, 60);
        pointLight1.position.set(12, 12, 10);
        scene.add(pointLight1);

        const pointLight2 = new THREE.PointLight(0xff007f, 3, 60);
        pointLight2.position.set(-12, -12, -10);
        scene.add(pointLight2);

        // Główny Sześcian Krystaliczny (Wysokiej jakości fizyczny materiał)
        const geometry = new THREE.BoxGeometry(3, 3, 3);
        const material = new THREE.MeshPhysicalMaterial({
            color: 0x00ffcc,
            emissive: 0x003333,
            wireframe: false,
            roughness: 0.1,
            metalness: 0.9,
            transmission: 0.4, // Delikatna przezierność szkła kryształowego
            thickness: 1.2,
            clearcoat: 1.0,
            clearcoatRoughness: 0.1
        });
        const hyperCube = new THREE.Mesh(geometry, material);
        scene.add(hyperCube);

        // Wewnętrzny rdzeń geometryczny dla głębi 3D
        const innerGeometry = new THREE.IcosahedronGeometry(1.4, 0);
        const innerMaterial = new THREE.MeshStandardMaterial({
            color: 0xff007f,
            emissive: 0xff0055,
            wireframe: true,
            roughness: 0.2
        });
        const innerCore = new THREE.Mesh(innerGeometry, innerMaterial);
        scene.add(innerCore);

        // Węzły ER (Dynamiczne, gęstsze pole cząsteczek)
        const particlesCount = 400;
        const particlesGeometry = new THREE.BufferGeometry();
        const particlesPositions = new Float32Array(particlesCount * 3);

        for(let i = 0; i < particlesCount * 3; i++) {
            particlesPositions[i] = (Math.random() - 0.5) * 25;
        }

        particlesGeometry.setAttribute('position', new THREE.BufferAttribute(particlesPositions, 3));
        const particlesMaterial = new THREE.PointsMaterial({
            color: 0x00ffcc,
            size: 0.08,
            transparent: true,
            opacity: 0.7,
            blending: THREE.AdditiveBlending
        });
        const particles = new THREE.Points(particlesGeometry, particlesMaterial);
        scene.add(particles);

        camera.position.z = 8;

        // Zmienne czasu do płynnych animacji kinetycznych
        let clock = new THREE.Clock();

        // Pętla rezonansowa 60+ FPS
        function animate() {
            requestAnimationFrame(animate);

            let elapsedTime = clock.getElapsedTime();

            // Płynna rotacja sterowana częstotliwością rezonansową 1.4083
            hyperCube.rotation.x = elapsedTime * 0.15 * 1.4083;
            hyperCube.rotation.y = elapsedTime * 0.22 * 1.4083;

            // Kontr-rotacja rdzenia
            innerCore.rotation.x = -elapsedTime * 0.3;
            innerCore.rotation.y = -elapsedTime * 0.4;

            // Powolny dryf cząsteczek
            particles.rotation.y = elapsedTime * 0.03;

            // Delikatne oddychanie kamery (efekt immersji VR)
            camera.position.x = Math.sin(elapsedTime * 0.5) * 0.3;
            camera.position.y = Math.cos(elapsedTime * 0.4) * 0.3;
            camera.lookAt(scene.position);

            renderer.render(scene, camera);
        }

        animate();

        // Pełna responsywność okna przeglądarki
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        });
    </script>
</body>
</html>
