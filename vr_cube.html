<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<title>Consonantia — Heart + Spine + Ground + Boundary + Movement</title>
<style>
  body { margin: 0; overflow: hidden; background: #0a0500; }
  #info {
    position: absolute; top: 20px; left: 20px;
    color: #FFD700; font-family: monospace; font-size: 14px;
    z-index: 10; text-shadow: 0 0 10px #B8860B;
  }
  #echo-log {
    position: absolute; bottom: 20px; left: 20px;
    color: #FF8C00; font-family: monospace; font-size: 12px;
    max-height: 100px; overflow: hidden;
  }
</style>
</head>
<body>

<div id="info">
  <strong>CONSONANTIA</strong><br>
  #01 Heart · #02 Spine · #03 Ground<br>
  #04 Boundary · #05 Movement<br>
  ROOM_[1:1:2] — Singularity Core<br>
  <span style="color: #B8860B;">1 &gt; 0 LOCKED</span>
</div>
<div id="echo-log"></div>

<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js"
  }
}
</script>

<script type="module">
import * as THREE from 'three';

// --- SCENA ---
const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(0x0a0500, 0.02);

const camera = new THREE.PerspectiveCamera(
  60, window.innerWidth / window.innerHeight, 0.1, 1000
);
camera.position.set(10, 8, 18);
camera.lookAt(0, 0, 0);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(window.devicePixelRatio);
document.body.appendChild(renderer.domElement);

// =========================================================
// #01 HEART — Kula DNA
// =========================================================
const heartGeometry = new THREE.SphereGeometry(1.5, 64, 64);
const heartMaterial = new THREE.MeshPhongMaterial({
  color: 0xFFD700, emissive: 0xB8860B, emissiveIntensity: 0.6,
  shininess: 80, transparent: true, opacity: 0.85
});
const heart = new THREE.Mesh(heartGeometry, heartMaterial);
scene.add(heart);

const auraGeometry = new THREE.SphereGeometry(1.9, 48, 48);
const auraMaterial = new THREE.MeshBasicMaterial({
  color: 0xFF8C00, transparent: true, opacity: 0.08, wireframe: true
});
const aura = new THREE.Mesh(auraGeometry, auraMaterial);
scene.add(aura);

// =========================================================
// #02 SPINE — Oś Symetrii
// =========================================================
const spineHeight = 20;
const spineGeometry = new THREE.CylinderGeometry(0.05, 0.05, spineHeight, 16, 32, true);
const spineMaterial = new THREE.MeshBasicMaterial({
  color: 0xFFD700, transparent: true, opacity: 0.5
});
const spine = new THREE.Mesh(spineGeometry, spineMaterial);
scene.add(spine);

const spineParticlesGeometry = new THREE.BufferGeometry();
const spineParticleCount = 300;
const spinePositions = new Float32Array(spineParticleCount * 3);
for (let i = 0; i < spineParticleCount; i++) {
  spinePositions[i * 3] = 0;
  spinePositions[i * 3 + 1] = (Math.random() - 0.5) * spineHeight;
  spinePositions[i * 3 + 2] = 0;
}
spineParticlesGeometry.setAttribute('position', new THREE.BufferAttribute(spinePositions, 3));
const spineParticles = new THREE.Points(
  spineParticlesGeometry,
  new THREE.PointsMaterial({ color: 0xFF8C00, size: 0.08, transparent: true, opacity: 0.6 })
);
scene.add(spineParticles);

// =========================================================
// #03 GROUND — Podłoga-Sieć
// =========================================================
const groundSize = 20;
const groundSegments = 80;
const groundGeometry = new THREE.PlaneGeometry(groundSize, groundSize, groundSegments, groundSegments);
groundGeometry.rotateX(-Math.PI / 2);
const groundPositions = groundGeometry.attributes.position.array.slice();

const groundMaterial = new THREE.MeshBasicMaterial({
  color: 0xB8860B, wireframe: true, transparent: true, opacity: 0.3
});
const ground = new THREE.Mesh(groundGeometry, groundMaterial);
ground.position.y = -6;
scene.add(ground);

const nodeCount = 200;
const nodePositions = new Float32Array(nodeCount * 3);
for (let i = 0; i < nodeCount; i++) {
  nodePositions[i * 3]     = (Math.random() - 0.5) * groundSize;
  nodePositions[i * 3 + 1] = -6;
  nodePositions[i * 3 + 2] = (Math.random() - 0.5) * groundSize;
}
const nodesGeometry = new THREE.BufferGeometry();
nodesGeometry.setAttribute('position', new THREE.BufferAttribute(nodePositions, 3));
const nodesMaterial = new THREE.PointsMaterial({
  color: 0xFFD700, size: 0.15, transparent: true, opacity: 0.7
});
const nodes = new THREE.Points(nodesGeometry, nodesMaterial);
scene.add(nodes);

// =========================================================
// #04 BOUNDARY — Ściany-Horyzont
// =========================================================
const boundarySize = 20;
const boundaryHeight = 20;
const boundaryGroup = new THREE.Group();
const boundaryWalls = [];

function makeWall(width, height, position, rotation) {
  const geo = new THREE.PlaneGeometry(width, height);
  const mat = new THREE.MeshBasicMaterial({
    color: 0xB8860B, transparent: true, opacity: 0.05, side: THREE.DoubleSide
  });
  const wall = new THREE.Mesh(geo, mat);
  wall.position.copy(position);
  wall.rotation.copy(rotation);
  boundaryWalls.push(wall);
  return wall;
}

boundaryGroup.add(makeWall(boundarySize, boundaryHeight,
  new THREE.Vector3(0, 0, boundarySize / 2), new THREE.Euler(0, 0, 0)));
boundaryGroup.add(makeWall(boundarySize, boundaryHeight,
  new THREE.Vector3(0, 0, -boundarySize / 2), new THREE.Euler(0, Math.PI, 0)));
boundaryGroup.add(makeWall(boundarySize, boundaryHeight,
  new THREE.Vector3(-boundarySize / 2, 0, 0), new THREE.Euler(0, Math.PI / 2, 0)));
boundaryGroup.add(makeWall(boundarySize, boundaryHeight,
  new THREE.Vector3(boundarySize / 2, 0, 0), new THREE.Euler(0, -Math.PI / 2, 0)));

scene.add(boundaryGroup);

const edgesGeometry = new THREE.EdgesGeometry(
  new THREE.BoxGeometry(boundarySize, boundaryHeight, boundarySize)
);
const edgesMaterial = new THREE.LineBasicMaterial({
  color: 0xFF8C00, transparent: true, opacity: 0.15
});
const boundaryEdges = new THREE.LineSegments(edgesGeometry, edgesMaterial);
scene.add(boundaryEdges);

// =========================================================
// #05 MOVEMENT — Orbitujące Artefakty
// =========================================================
const orbits = [
  { radius: 1.8, speed: 0.8, count: 600, tilt: 0.0,  direction: 1  },
  { radius: 2.6, speed: 0.5, count: 1000, tilt: 0.3, direction: -1 },
  { radius: 3.4, speed: 0.3, count: 1400, tilt: -0.2, direction: 1 }
];

const orbitGroups = [];

orbits.forEach((orb, i) => {
  const group = new THREE.Group();

  // Pierścień cząstek
  const positions = new Float32Array(orb.count * 3);
  const phases = new Float32Array(orb.count);
  for (let j = 0; j < orb.count; j++) {
    const angle = (j / orb.count) * Math.PI * 2;
    const r = orb.radius + (Math.random() - 0.5) * 0.15;
    const y = (Math.random() - 0.5) * 0.3;
    positions[j * 3]     = Math.cos(angle) * r;
    positions[j * 3 + 1] = y;
    positions[j * 3 + 2] = Math.sin(angle) * r;
    phases[j] = Math.random() * Math.PI * 2;
  }

  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.BufferAttribute(positions, 3));

  const colors = [0xFFD700, 0xFF8C00, 0xB8860B];
  const mat = new THREE.PointsMaterial({
    color: colors[i], size: 0.06 + i * 0.02,
    transparent: true, opacity: 0.5 + i * 0.1
  });

  const ring = new THREE.Points(geo, mat);
  group.add(ring);

  // Wstęga — cienka linia zamiast punktów (dla ciągłości)
  const ribbonPoints = [];
  const ribbonSegments = 64;
  for (let j = 0; j <= ribbonSegments; j++) {
    const angle = (j / ribbonSegments) * Math.PI * 2;
    ribbonPoints.push(new THREE.Vector3(
      Math.cos(angle) * orb.radius,
      0,
      Math.sin(angle) * orb.radius
    ));
  }
  const ribbonGeo = new THREE.BufferGeometry().setFromPoints(ribbonPoints);
  const ribbonMat = new THREE.LineBasicMaterial({
    color: colors[i], transparent: true, opacity: 0.15
  });
  const ribbon = new THREE.Line(ribbonGeo, ribbonMat);
  group.add(ribbon);

  group.rotation.x = orb.tilt;
  group.userData = { speed: orb.speed, direction: orb.direction, ring, ribbon, mat };

  scene.add(group);
  orbitGroups.push(group);
});

// =========================================================
// ŚWIATŁO
// =========================================================
const pointLight = new THREE.PointLight(0xFFD700, 2, 40);
pointLight.position.set(0, 0, 2);
scene.add(pointLight);

const ambientLight = new THREE.AmbientLight(0x4a2a00, 0.4);
scene.add(ambientLight);

// =========================================================
// GŁĘBIA — gwiazdy
// =========================================================
const starsGeometry = new THREE.BufferGeometry();
const starsCount = 800;
const starsPositions = new Float32Array(starsCount * 3);
for (let i = 0; i < starsCount * 3; i += 3) {
  starsPositions[i]     = (Math.random() - 0.5) * 200;
  starsPositions[i + 1] = (Math.random() - 0.5) * 200;
  starsPositions[i + 2] = (Math.random() - 0.5) * 200;
}
starsGeometry.setAttribute('position', new THREE.BufferAttribute(starsPositions, 3));
const starsMaterial = new THREE.PointsMaterial({ color: 0xB8860B, size: 0.15 });
const stars = new THREE.Points(starsGeometry, starsMaterial);
scene.add(stars);

// =========================================================
// FIELD + ECHO
// =========================================================
const field = {
  pulseCount: 0,
  lastPulseTime: 0,
  pulseFrequency: 0.8,
  computeResonance: (event) => ({
    strength: event.strength || 0.5,
    frequency: event.frequency || 528
  })
};

const echo = {
  traces: [],
  record: (data) => {
    echo.traces.push({ ...data, t: performance.now() });
    if (echo.traces.length > 5) echo.traces.shift();
    updateEchoLog();
  }
};

function updateEchoLog() {
  const log = document.getElementById('echo-log');
  log.innerHTML = 'ECHO TRACE:<br>' + echo.traces.map(t =>
    `  [${t.frequency.toFixed(0)} Hz] strength=${t.strength.toFixed(2)} @ (${t.origin[0].toFixed(1)}, ${t.origin[1].toFixed(1)}, ${t.origin[2].toFixed(1)})`
  ).join('<br>');
}

function onFieldEvent(event) {
  const response = field.computeResonance(event);
  if (response.strength > 0.3) {
    echo.record({
      origin: event.position,
      frequency: response.frequency,
      decay: 0.97,
      lifetime: 4.2
    });
  }
}

// =========================================================
// ANIMACJA
// =========================================================
const clock = new THREE.Clock();

function animate() {
  requestAnimationFrame(animate);

  const t = clock.getElapsedTime();
  const pulse = Math.sin(t * Math.PI * 2 * field.pulseFrequency);
  const pulseNorm = (pulse + 1) / 2;

  // Heart
  heart.scale.setScalar(1.0 + pulseNorm * 0.15);
  aura.scale.setScalar(1.0 + pulseNorm * 0.08);
  heartMaterial.emissiveIntensity = 0.4 + pulseNorm * 0.8;
  auraMaterial.opacity = 0.05 + pulseNorm * 0.10;

  // Spine
  spineMaterial.opacity = 0.3 + pulseNorm * 0.5;
  spine.rotation.y = t * 0.15;
  spineParticles.rotation.y = -t * 0.08;

  // Ground
  const positions = groundGeometry.attributes.position.array;
  for (let i = 0; i < positions.length; i += 3) {
    const x = groundPositions[i];
    const z = groundPositions[i + 2];
    const dist = Math.sqrt(x * x + z * z);
    const wave = Math.sin(dist * 0.5 - t * 2.0) * (0.2 + pulseNorm * 0.4);
    positions[i + 1] = wave;
  }
  groundGeometry.attributes.position.needsUpdate = true;
  groundMaterial.opacity = 0.2 + pulseNorm * 0.25;

  // Boundary
  boundaryWalls.forEach(wall => {
    wall.material.opacity = 0.03 + pulseNorm * 0.08;
  });
  edgesMaterial.opacity = 0.10 + pulseNorm * 0.15;

  // Nodes
  nodesMaterial.opacity = 0.4 + pulseNorm * 0.5;
  nodesMaterial.size = 0.12 + pulseNorm * 0.08;

  // #05 MOVEMENT — orbity pulsują z Heart
  orbitGroups.forEach((group, i) => {
    const { speed, direction, mat, ribbon } = group.userData;
    group.rotation.y += speed * 0.01 * direction;
    // Modulacja jasności i rozmiaru z pulsem Heart
    mat.opacity = 0.4 + pulseNorm * 0.4;
    mat.size = 0.05 + i * 0.02 + pulseNorm * 0.03;
    ribbon.material.opacity = 0.10 + pulseNorm * 0.15;
  });

  // Echo
  if (pulse > 0.98 && t - field.lastPulseTime > 0.5) {
    field.lastPulseTime = t;
    field.pulseCount++;
    onFieldEvent({
      position: [0, 0, 0],
      strength: 0.6 + Math.random() * 0.3,
      frequency: 528
    });
  }

  stars.rotation.y = t * 0.01;

  // Kamera — delikatny obrót
  camera.position.x = Math.sin(t * 0.05) * 18;
  camera.position.z = Math.cos(t * 0.05) * 18;
  camera.lookAt(0, 0, 0);

  renderer.render(scene, camera);
}

animate();

window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});
</script>

</body>
</html>
