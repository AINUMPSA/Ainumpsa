name: AINUMPSA Hyper Version 2.14 Pipeline

on:
  push:
    paths:
      - 'inputs/**'
      - 'Knowledge_base/**'
  workflow_dispatch: # Pozwala odpalić ręcznie guzikiem "Run workflow"

jobs:
  run-hyper-version:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Run Hyper Version 2.14 Engine
        run: |
          python hyper_version_2_14.py

      - name: Commit and Push Metadata & Reports
        run: |
          git config --global user.name "AINUMPSA-Bot"
          git config --global user.email "bot@ainumpsa.internal"
          git add Knowledge_base/ *.json
          git commit -m "auto: Hyper Version 2.14 metadata & daily sync [1>0]" || exit 0
          git push

