name: AINUMPSA Collision Engine

on:
  push:
    paths:
      - 'knowledge_base/**'
  workflow_dispatch:   # pozwala odpalić ręcznie

jobs:
  run-collision:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Run Collision Engine
        run: python collision_engine.py

      - name: Commit results
        run: |
          git config --global user.name "AINUMPSA-Bot"
          git config --global user.email "bot@ainumpsa.org"
          git add collision_results/
          if git diff --staged --quiet; then
            echo "Brak nowych wyników do zapisania."
          else
            git commit -m "🤖 Collision: nowe namiary z knowledge_base [skip ci]"
            git push
          fi
