name: AINUMPSA Collision Engine

on:
  push:
    branches: [ main ]
    paths:
      - 'knowledge_base/**'
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ainumpsa-collision
  cancel-in-progress: false

jobs:
  collision:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests aiohttp numpy scipy matplotlib

      - name: Run collision engine
        run: |
          python collision_engine.py

      - name: Configure git
        run: |
          git config --local user.email "41898282+github-actions[bot]@://github.com"
          git config --local user.name "github-actions[bot]"

      - name: Commit and push results
        run: |
          git add .
          if git diff --staged --quiet; then
            echo "Brak zmian do commitu."
          else
            git commit -m "🤖 Collision: nowe namiary z knowledge_base [skip ci]"
            
            # Pobieramy najświeższy stan gałęzi głównej z serwera
            git fetch origin main
            
            # Automatycznie rozwiązujemy konflikty na korzyść zmian z serwera (theirs), 
            # dopisując nasz nowo wygenerowany plik JSON bez przerywania potoku.
            git rebase -X theirs origin/main || (
              echo "[WARN] Konflikt rebase! Resetuję indeks i wymuszam integrację struktur..."
              git rebase --abort
              git pull origin main --strategy-option=theirs --no-edit
            )
            
            # Bezpieczne wypchnięcie zmian z pętlą ratunkową w razie jednoczesnego zapisu przez drugi potok
            git push origin main || (
              git fetch origin main
              git pull origin main --rebase --strategy-option=theirs --no-edit
              git push origin main
            )
          fi
