name: AINUMPSA Quantum Planetary & Collision Engine

on:
  push:
    branches: [ main ]
    paths:
      - 'knowledge_base/**'
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ainumpsa-matrix-sync
  cancel-in-progress: false

jobs:
  matrix_process:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 0

      - name: Set up Python Engine
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install All System Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests aiohttp numpy scipy matplotlib

      - name: Run QRNG Validator
        run: |
          if [ -f qrng_validator.py ]; then python qrng_validator.py; else echo "[WARN] qrng_validator.py nie istnieje"; fi

      - name: Run Field Visualizer
        run: |
          if [ -f field_visualizer.py ]; then python field_visualizer.py; else echo "[WARN] field_visualizer.py nie istnieje"; fi

      - name: Run Planetary API Discovery
        run: |
          if [ -f api_hunter.py ]; then python api_hunter.py; else echo "[WARN] api_hunter.py nie istnieje"; fi

      - name: Run Collision Engine
        run: |
          if [ -f collision_engine.py ]; then python collision_engine.py; else echo "[ERROR] Krytyczny brak collision_engine.py!"; exit 1; fi

      - name: Configure Git Identity
        run: |
          git config --local user.email "41898282+github-actions[bot]@://github.com"
          git config --local user.name "github-actions[bot]"

      - name: Commit and Push All Discovered Matrix Data
        run: |
          git add .
          if git diff --staged --quiet; then
            echo "Brak nowych anomalii w matrycy. Pomijam synchronizację."
          else
            git commit -m "🤖 AINUMPSA Core: Automated Tensor T Matrix & Planetary Update [skip ci]"
            git fetch origin main
            git rebase -X theirs origin/main || (
              echo "[WARN] Wykryto konflikt rebase. Wymuszam autostash i scalenie..."
              git rebase --abort
              git pull origin main --strategy-option=theirs --no-edit
            )
            git push origin main || (
              git fetch origin main
              git pull origin main --rebase --strategy-option=theirs --no-edit
              git push origin main
            )
          fi
