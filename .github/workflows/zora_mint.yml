name: AINUMPSA Zora Minter Workflow

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-and-mint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      # KROK NAPRAWCZY: Instalujemy biblioteki potrzebne dla validatora QRNG
      - name: Install Dependencies
        run: |
          pip install pypdf

      # KROK GŁÓWNY: Uruchamiamy silnik Hyper Version 2.14
      - name: Run AINUMPSA Hyper Version 2.14
        env:
          # Przekazujemy klucz prywatny z Secrets do środowiska
          ZORA_PRIVATE_KEY: ${{ secrets.ZORA_PRIVATE_KEY }}
        run: |
          mkdir -p inputs/media Knowledge_base
          python vip_media_injector.py
          python hyper_version_2_14.py
          
          # Odpalamy minter, który naprawiliśmy w Kroku 1
          python zora_minter.py
          
          # Uruchamiamy pozostałe skrypty systemowe
          python readme_mutator.py
          python qrng_validator.py

