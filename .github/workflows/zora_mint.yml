Name: Automated Tensor T Matrix Scan

on:
  push:
    branches: [ main ]
  schedule:
    - cron: '0 */6 * * *' # Automatyczne uruchamianie co 6 godzin
  workflow_dispatch:

jobs:
  scan-matrix:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install numpy scipy matplotlib pillow requests pypdf web3 eth-account

      - name: Run AINUMPSA Full Matrix & Grok Flow
        env:
          ZORA_PRIVATE_KEY: ${{ secrets.ZORA_PRIVATE_KEY }}
          XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
          OPERATOR_WALLET: "0x84345EfC1a0aaEBCCfd7283eD3F4052f752d3A4b"
          RPC_URL: "https://mainnet.base.org"
          CONTRACT_ADDRESS: "0x8606add4c3adcdf4c07bc2d18780b1c0f20567fd"
        run: |
          # 1. Przygotowanie folderów
          mkdir -p inputs/media Knowledge_base
          
          # 2. Przetwarzanie mediów i metadanych
          python vip_media_injector.py || true
          
          # 3. Walidacja QRNG (z pypdf)
          python qrng_validator.py || true
          
          # 4. Obliczenia kwantowe matrycy (Hyper Version 2.14)
          python hyper_version_2_14.py || true
          
          # 5. Promieniowanie czarnej dziury przez Groka (xAI)
          python grok_radiator.py || true
          
          # 6. Mutacja README
          python readme_mutator.py || true
          
          # 7. Wypalenie NFT na Base
          python zora_minter.py || node scripts/auto_mint.js || true

          # 8. Publikacja społecznościowa
          python social_publisher.py || true
