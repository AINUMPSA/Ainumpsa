name: AINUMPSA Zora Minter Workflow

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-and-mint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          pip install pypdf

      - name: Run AINUMPSA Hyper Version 2.14
        env:
          ZORA_PRIVATE_KEY: ${{ secrets.ZORA_PRIVATE_KEY }}
          # RPC_URL: ${{ secrets.RPC_URL }} # Opcjonalnie, jeśli masz
        run: |
          mkdir -p inputs/media Knowledge_base
          python vip_media_injector.py
          python hyper_version_2_14.py
          # Odkomentuj linię poniżej, gdy wkleisz poprawny kod w Kroku 1
          python zora_minter.py
          python readme_mutator.py
          python qrng_validator.py

