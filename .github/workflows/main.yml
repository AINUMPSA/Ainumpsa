name: Automated Tensor T Matrix Scan

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  scan-matrix:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install numpy scipy matplotlib pillow requests

      - name: Run AINUMPSA scripts
        run: |
          python main.py || true
          python qrng_validator.py || true
          python field_visualizer.py || true
          python matrix_analyser.py || true
          python readme_mutator.py || true
          python matrix_blast.py || true

      - name: Run social publisher
        run: python social_publisher.py || true

      - name: Mint NFT on Zora
        run: python zora_minter.py
