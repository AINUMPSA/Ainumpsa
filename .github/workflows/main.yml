name: Automated Tensor T Matrix Scan

on:
  push:
    branches: [ main ]
  workflow_dispatch:

# Uprawnienia wymagane do zapisywania i wysyłania zmian (push) do repozytorium
permissions:
  contents: write

jobs:
  scan-matrix:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install numpy scipy matplotlib pillow requests pypdf web3

      - name: Prepare folders
        run: mkdir -p inputs/media Knowledge_base nft_ready

      - name: Run VIP Media Injector
        run: python vip_media_injector.py || true

      - name: Run QRNG Validator
        run: python qrng_validator.py || true

      - name: Run Hyper Version 2.14 Engine
        run: python hyper_version_2_14.py || true

      - name: Run Grok Radiation Engine
        run: python grok_radiator.py || true

      - name: Mutate README
        run: python readme_mutator.py || true

      - name: Prepare NFT (no mint)
        run: python nft_preparer.py || true

      - name: Run Social Publisher
        run: python social_publisher.py || true

      # NOWY KROK: Zapisywanie wygenerowanego folderu nft_ready na stałe w GitHubie
      - name: Commit and Push Generated NFT
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          # Dodanie folderu nft_ready oraz ewentualnych zmian w README / Knowledge_base
          git add nft_ready/ Knowledge_base/ README.md || true
          
          # Sprawdzenie, czy są jakieś nowe pliki do zapisania
          if git diff --staged --quiet; then
            echo "[INFO] Brak nowych plików NFT do zacommitowania."
          else
            git commit -m "auto: Grok prepared NFT in nft_ready/ [skip ci]"
            git push
            echo "[SUCCESS] Folder nft_ready został pomyślnie zapisany w repozytorium! 🎉"
          fi
