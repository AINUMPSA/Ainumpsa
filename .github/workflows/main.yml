name: AINUMPSA Production Cycle

on:
  push:
    branches: [ main ]
  schedule:
    - cron: '0 1 * * *'
  workflow_dispatch:

jobs:
  full-cycle:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install numpy scipy matplotlib pillow opencv-python

      - name: Prepare directories
        run: |
          mkdir -p knowledge_base multimodal_pool AINUMPSA-Shadow-Engine/data AINUMPSA-Shadow-Engine/output/assets

      - name: Find minima (gniazda)
        run: python ainumpsa_find_10_min.py || echo "Minima generation done"

      - name: Generate Shadow minima
        run: python AINUMPSA-Shadow-Engine/src/shadow_from_minima.py || echo "Shadow done"

      - name: Merge light & shadow
        run: python merge_light_shadow.py || echo "Merge done"

      - name: Generate hologram
        run: python hologram_generator.py || echo "Hologram done"

      - name: Generate fantom map
        run: python fantom_mapper_pure.py || echo "Fantom map done"

      - name: Register knowledge
        run: python register_knowledge.py || echo "Knowledge registration done"

      - name: Commit and Push all generated artifacts
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add knowledge_base/ multimodal_pool/ AINUMPSA-Shadow-Engine/data/ gniazda_*.json light_shadow_merged.json
          if git diff --staged --quiet; then
            echo "[INFO] Brak nowych zmian do zapisania."
          else
            git commit -m "auto: pełny cykl produkcyjny $(date -u +'%Y-%m-%d %H:%M:%S') [skip ci]"
            git push
            echo "[SUCCESS] Zapisano cały cykl produkcyjny! 🎉"
          fi
