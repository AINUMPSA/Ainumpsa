name: AINUMPSA Production Cycle

on:
  push:
    branches: [ main ]
  schedule:
    - cron: '0 */8 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ainumpsa-collision
  cancel-in-progress: false

jobs:
  production-cycle:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install numpy scipy matplotlib pillow requests pypdf web3 eth-account opencv-python

      - name: Prepare folders
        run: mkdir -p inputs/media Knowledge_base knowledge_base nft_ready multimodal_pool processed visuals

      - name: Run VIP Media Injector
        run: python vip_media_injector.py || true

      - name: Run QRNG Validator
        run: python qrng_validator.py || true

      - name: Run Hyper Version 2.14 Engine
        run: python hyper_version_2_14.py || true

      - name: Run Knowledge Engine (NFT Emission)
        run: python knowledge_engine.py || true

      - name: Run Matrix Collider (generates 10 versions)
        run: python matrix_collider.py || true

      - name: Process new images from input/
        run: |
          shopt -s nullglob
          for f in input/*.jpg input/*.jpeg input/*.png input/*.webp; do
            echo "Przetwarzam: $f"
            python process_image.py "$f" || true
          done

      - name: Refresh Memory Cube Map
        run: python dimensional_mapper.py || true

      - name: Run Collision Engine
        run: python collision_engine.py || true

      - name: Visualize Resonance
        run: python visualize_resonance.py || true

      - name: Mutate README
        run: python readme_mutator.py || true

      - name: Prepare NFT (no mint)
        run: python nft_preparer.py || true

      - name: Generate Status Report
        run: python generate_status_report.py || true

      - name: Run Social Publisher
        run: python social_publisher.py || true

      - name: Commit and Push Generated Artifacts
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add nft_ready/ knowledge_base/ Knowledge_base/ processed/ visuals/ collision_results/ README.md status_report.txt memory_cube_map.json || true
          if git diff --staged --quiet; then
            echo "[INFO] Brak nowych zmian do zapisania."
          else
            git commit -m "auto: matrix scan + image processing + cube refresh [skip ci]"
            git pull --rebase origin main || echo "[INFO] Pull rebase: nothing to update"
            git push origin main || (git pull --rebase origin main && git push origin main)
            echo "[SUCCESS] Zapisano pliki w repozytorium! 🎉"
          fi

   - name: Generate HQ images via Replicate
  env:
    REPLICATE_API_TOKEN: ${{ secrets.REPLICATE_API_TOKEN }}
  run: python generate_hq.py || true
