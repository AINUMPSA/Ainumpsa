name: Automated Tensor T Matrix Scan

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install numpy scipy

      - name: Verify Python
        run: |
          python --version
          pip list

      - name: Run AINUMPSA Core
        run: python ainumpsa_core.py

      - name: Commit and push results (if gniazda.json exists)
        run: |
          if [ -f "gniazda.json" ]; then
            git config user.name "AINUMPSA Bot"
            git config user.email "bot@ainumpsa.com"
            git add gniazda.json
            git commit -m "Auto-update: gniazda.json $(date -u +'%Y-%m-%d %H:%M:%S')" || echo "No changes to commit"
            git push
            echo "[SUCCESS] Zapisano pliki w repozytorium! 🎉"
          else
            echo "[INFO] Brak pliku gniazda.json - pomijam commit."
          fi
