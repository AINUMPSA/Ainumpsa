name: Automated Tensor T Matrix Scan

on:
  push:
    branches: [ main ]
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

jobs:
  scan-matrix:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy scipy matplotlib pillow requests

      - name: Run AINUMPSA scripts
        run: |
          python main.py || true
          python qrng_validator.py || true
          python field_visualizer.py || true
          python matrix_analyser.py || true
          python readme_mutator.py || true
          python matrix_blast.py || true

      - name: Commit and push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md *.gif *.png *.json || true
          git commit -m "🤖 [AUTONOMNA MUTACJA] Aktualizacja Wag Osobliwości Układu" || echo "Brak zmian do zatwierdzenia"
          git push

      - name: Run social publisher
        run: python social_publisher.py
